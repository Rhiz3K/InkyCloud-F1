name: Set up locked Python environment
description: Install Python 3.15, uv, and the exact development dependency set.

inputs:
  enable-cache:
    description: Enable uv's dependency cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python 3.15
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: ${{ inputs.enable-cache }}

    - name: Install locked dependencies
      shell: bash
      run: uv sync --locked --group dev
