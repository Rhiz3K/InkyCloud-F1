# GitHub Copilot Setup Steps
# This file automates the development environment setup for Copilot coding agent

steps:
  - name: Install uv
    command: pip install uv
    description: Installs the uv package manager used by CI and the locked dependency set

  - name: Install project dependencies
    command: uv sync --locked --group dev
    description: Creates .venv and installs the exact locked runtime and dev dependencies

  - name: Verify installation
    command: uv run pytest --version && uv run ruff --version && uv run uvicorn --version
    description: Verifies that key development tools are installed correctly

  - name: Run initial tests
    command: uv run pytest -m "not benchmark"
    description: Runs the test suite to ensure the environment is properly configured
