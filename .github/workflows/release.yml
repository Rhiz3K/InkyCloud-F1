name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - CHANGELOG.md
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    permissions:
      contents: write # Required to create the GitHub release and tag

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub release from CHANGELOG
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const fs = require("node:fs");

            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const matches = [...changelog.matchAll(/^## \[(\d+\.\d+\.\d+)\] - .*$/gm)];

            if (matches.length === 0) {
              core.setFailed("No semantic version headings found in CHANGELOG.md");
              return;
            }

            const version = matches[0][1];
            const tag = `v${version}`;
            const currentHeading = matches[0];
            const nextHeading = matches[1] ?? null;

            const bodyStart = currentHeading.index + currentHeading[0].length;
            const bodyEnd = nextHeading ? nextHeading.index : changelog.length;

            let body = changelog.slice(bodyStart, bodyEnd).trim();
            body = body.replace(/\n---\s*$/, "").trim();

            const previousTag = nextHeading ? `v${nextHeading[1]}` : null;
            const compareUrl = previousTag
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${previousTag}...${tag}`
              : `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md`;

            if (!body.includes("**Full Changelog**:")) {
              body = `${body}\n\n**Full Changelog**: ${compareUrl}`;
            }

            const commitTitleRaw = context.payload.head_commit?.message?.split("\n")[0] ?? "";
            const commitTitle = commitTitleRaw.replace(/\s+\(#\d+\)$/, "");
            const releasePrefix = `Release ${tag}`;
            const releaseName = commitTitle.startsWith(releasePrefix) ? commitTitle : tag;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release ${tag} already exists, skipping.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: releaseName,
              body,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
            });

            core.info(`Created release ${tag}`);

  publish-container:
    name: publish-container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
