name: CodSpeed Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for CodSpeed's OIDC authentication

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python environment
        uses: ./.github/actions/setup-python

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4
        with:
          mode: simulation
          run: uv run pytest tests/test_benchmarks.py --codspeed
