name: CI

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # Validate every ref on an ephemeral runner, including untrusted fork PRs.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify CHANGELOG update for main PRs
      if: >-
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'github-actions[bot]'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if ! git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx "CHANGELOG.md"; then
          echo "::error file=CHANGELOG.md::Pull requests targeting main must update CHANGELOG.md."
          exit 1
        fi

    - name: Run project CI
      uses: ./.github/actions/ci-test
      with:
        validate-release: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'github-actions[bot]' }}
