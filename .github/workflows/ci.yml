name: CI

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication with DeepSource

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: Verify CHANGELOG update for main PRs
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      run: |
        if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx "CHANGELOG.md"; then
          echo "::error file=CHANGELOG.md::Pull requests targeting main must update CHANGELOG.md."
          exit 1
        fi
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -e .
        pip install pytest pytest-asyncio pytest-cov ruff
    
    - name: Lint with ruff
      run: |
        ruff check .
    
    - name: Run tests
      run: |
        pytest tests/ -v
    
    - name: Test Docker build
      run: |
        docker build -t f1-eink-cal:test .
