name: CI

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication with DeepSource

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -e .
        pip install pytest pytest-asyncio pytest-cov ruff
    
    - name: Lint with ruff
      run: |
        ruff check .
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=app --cov-report=xml
    
    - name: Report coverage to DeepSource
      run: |
        curl https://deepsource.io/cli | sh
        ./bin/deepsource report --analyzer test-coverage --key python --value-file ./coverage.xml --use-oidc
    
    - name: Test Docker build
      run: |
        docker build -t f1-eink-cal:test .
