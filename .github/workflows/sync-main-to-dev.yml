name: Sync Main to Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Prepare sync branch
        id: prepare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main dev
          git checkout -B sync/main-to-dev origin/dev

          if ! git merge --no-ff --no-edit origin/main; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "has_conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet origin/dev...HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.prepare.outputs.has_changes == 'true'
        run: |
          git push --force-with-lease origin sync/main-to-dev

      - name: Create or update sync PR
        if: steps.prepare.outputs.has_changes == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "sync/main-to-dev";
            const base = "dev";

            const title = "chore: sync main into dev";
            const body = [
              "Automated sync PR to keep `dev` aligned with `main` after release merges.",
              "",
              `- Trigger commit: ${context.sha}`,
              "- Merge method: merge commit",
              "",
              "This PR is managed by CI.",
            ].join("\n");

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
              per_page: 1,
            });

            let pull;
            if (prs.length > 0) {
              pull = prs[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                title,
                body,
              });
              core.info(`Updated existing sync PR #${pull.number}`);
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
              });
              pull = created.data;
              core.info(`Created sync PR #${pull.number}`);
            }

            core.setOutput("number", String(pull.number));

      - name: Enable auto-merge for sync PR
        if: steps.prepare.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number("${{ steps.pr.outputs.number }}");

            const data = await github.graphql(
              `query ($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }`,
              { owner, repo, number },
            );

            const pullRequest = data.repository.pullRequest;
            if (pullRequest.autoMergeRequest) {
              core.info(`Auto-merge already enabled for PR #${number}`);
              return;
            }

            try {
              await github.graphql(
                `mutation ($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(
                    input: {
                      pullRequestId: $pullRequestId
                      mergeMethod: MERGE
                    }
                  ) {
                    pullRequest {
                      number
                    }
                  }
                }`,
                { pullRequestId: pullRequest.id },
              );
              core.info(`Enabled auto-merge for PR #${number}`);
            } catch (error) {
              core.warning(`Could not enable auto-merge for PR #${number}: ${error.message}`);
            }

      - name: Fail on merge conflict
        if: steps.prepare.outputs.has_conflict == 'true'
        run: |
          echo "Automatic sync from main to dev has merge conflicts. Resolve manually."
          exit 1

      - name: No changes to sync
        if: steps.prepare.outputs.has_changes != 'true' && steps.prepare.outputs.has_conflict != 'true'
        run: |
          echo "Dev branch is already up to date with main."
