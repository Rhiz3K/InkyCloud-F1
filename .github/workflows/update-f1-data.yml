name: Update F1 Data

on:
  schedule:
    # Monday 06:00 UTC - after Sunday GP
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'What to update'
        required: true
        default: 'historical'
        type: choice
        options:
          - historical
          - seasons
          - all

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'

      - name: Install dependencies
        run: pip install httpx

      - name: Update historical results
        if: github.event.inputs.update_type != 'seasons'
        run: python scripts/update_historical.py

      - name: Update season calendars
        if: github.event.inputs.update_type == 'seasons' || github.event.inputs.update_type == 'all'
        run: python scripts/update_seasons.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet app/assets/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-f1-data-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/assets/
          git commit -m "chore: update F1 data"
          git push -u origin "$BRANCH"
          gh pr create --title "chore: update F1 data" --body "Automated F1 data update (historical results)" --base main --head "$BRANCH"
