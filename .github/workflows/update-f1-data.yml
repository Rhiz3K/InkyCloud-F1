name: Update F1 Season Data

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install httpx

      - name: Update season calendars
        run: python scripts/update_seasons.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet app/assets/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-f1-data-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/assets/
          git commit -m "chore: update F1 data"
          git push -u origin "$BRANCH"
          gh pr create --title "chore: update F1 season data" --body "Manual F1 season calendar update from Jolpica API. Historical race results are refreshed daily by the running app." --base main --head "$BRANCH"
