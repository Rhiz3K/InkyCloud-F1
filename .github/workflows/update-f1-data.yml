name: Update F1 Season Data

on:
  workflow_dispatch:
  schedule:
    # Weekly while the championship is normally in season.
    - cron: "17 6 * 3-11 1"
    # Daily during the pre-season calendar announcement window.
    - cron: "17 6 * 12,1,2 *"

permissions: {}

concurrency:
  group: update-f1-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the generated data branch
      pull-requests: write # Required to open the generated data pull request

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Set DATA_UPDATE_TOKEN (fine-grained PAT or GitHub App token with contents and
          # pull-requests write) so the generated PR triggers CI. Pull requests opened with
          # GITHUB_TOKEN do not start pull_request workflows, so required checks never report.
          token: ${{ secrets.DATA_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Update season calendars
        id: update
        # Keep going so a calendar that did update still becomes a pull request even when
        # another requested season failed; the final step still marks the run as failed.
        continue-on-error: true
        run: uv run --locked python scripts/update_seasons.py

      - name: Verify active circuits have track assets
        id: track_assets
        # Keep the partial-update PR path alive, then fail the completed workflow below so the
        # workflow_run monitor opens or updates its persistent failure issue.
        continue-on-error: true
        run: uv run --locked python scripts/check_track_assets.py

      - name: Verify reviewed asset register
        id: legal_assets
        # update_seasons.py records the SHA-256 of every rewritten snapshot; this confirms the
        # register matches the tree before the pull request is opened.
        continue-on-error: true
        run: uv run --locked python scripts/check_legal_assets.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet app/assets/ || echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-f1-data-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/assets/
          git commit -m "chore: update F1 data"
          gh auth setup-git
          git push -u origin "$BRANCH"
          {
            echo "F1 season calendar update from the Jolpica API."
            echo
            echo "Changed files:"
            git diff --name-only HEAD~1 HEAD | sed 's/^/- `/; s/$/`/'
            echo
            echo "The SHA-256 of each rewritten snapshot is already recorded in"
            echo "\`app/assets/asset-register.json\`. Review the calendar changes before merging;"
            echo "new season files are registered without \`reviewed_on\`, so add it once reviewed."
            echo
            echo "Historical race results are refreshed daily by the running app."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --title "chore: update F1 season data" --body-file "$RUNNER_TEMP/pr-body.md" --base main --head "$BRANCH"

      - name: Fail the run when an update or asset check failed
        if: >-
          steps.update.outcome == 'failure' ||
          steps.track_assets.outcome == 'failure' ||
          steps.legal_assets.outcome == 'failure'
        run: |
          if [[ "${{ steps.update.outcome }}" == "failure" ]]; then
            echo "::error::scripts/update_seasons.py reported a failure; see the update step log"
          fi
          if [[ "${{ steps.track_assets.outcome }}" == "failure" ]]; then
            echo "::error::Active circuit track assets are incomplete; see the asset check log"
          fi
          if [[ "${{ steps.legal_assets.outcome }}" == "failure" ]]; then
            echo "::error::The asset register does not match the updated tree; see the register log"
          fi
          exit 1
