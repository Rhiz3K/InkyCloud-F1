name: Dependabot Auto-Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  security-events: read

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'Rhiz3K/InkyCloud-F1' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      DEPENDABOT_METADATA_TOKEN: ${{ secrets.DEPENDABOT_METADATA_TOKEN }}

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Fetch Dependabot alert metadata
        id: alert_metadata
        if: env.DEPENDABOT_METADATA_TOKEN != ''
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ env.DEPENDABOT_METADATA_TOKEN }}"
          alert-lookup: true

      - name: Enable auto-merge for safe dependency updates
        if: >-
          steps.alert_metadata.outputs.alert-state == 'OPEN' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
