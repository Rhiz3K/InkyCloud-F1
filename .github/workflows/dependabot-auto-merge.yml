name: Dependabot Auto-Merge

on: # zizmor: ignore[dangerous-triggers]
  # This privileged trigger is intentional: Dependabot pull_request tokens are read-only.
  # The job never checks out or executes PR code and gates every action on actor and repository.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable Dependabot auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'Rhiz3K/InkyCloud-F1' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to update the protected branch through GitHub's auto-merge queue.
      pull-requests: write # Required to enable auto-merge on the Dependabot pull request.
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for safe dependency updates
        # Advisory state is intentionally not a separate gate: this only enables GitHub's
        # auto-merge queue, and branch protection still requires every configured check to pass.
        # Docker and semver-major updates remain excluded for manual review.
        if: >-
          always() &&
          steps.metadata.outcome == 'success' &&
          steps.metadata.outputs.package-ecosystem != 'docker' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
