{% import "configure/_timezone_picker.html" as tz_picker %}
{% include "configure/_track_options.html" %}
{{ tz_picker.mobile() }}
{% call tz_picker.desktop() %}
  <div class="flex-shrink-0 px-2 py-1.5 border-t-2 border-black bg-gray-50" id="weatherContainer">
    <div class="mb-1.5 flex items-center gap-1">
      <label class="text-xs font-bold uppercase" id="weatherLabel">Weather</label>
    </div>
    <input
      type="checkbox"
      id="weatherToggle"
      checked
      data-on-change="updateWeatherTypeAvailability updatePreview"
      class="hidden"
    />
    <div class="flex gap-1" id="weatherTypeContainer">
      <button
        type="button"
        data-on-click="setWeatherType" data-args='["off"]'
        id="weatherOffBtn"
        class="weather-type-btn flex-1 px-2 py-0.5 text-[9px] font-bold uppercase text-center border border-black transition-all bg-white hover:bg-black hover:text-white"
      >
        OFF
      </button>
      <button
        type="button"
        data-on-click="setWeatherType" data-args='["current"]'
        id="weatherCurrentBtn"
        class="weather-type-btn flex-1 px-2 py-0.5 text-[9px] font-bold uppercase text-center border border-black transition-all bg-white hover:bg-black hover:text-white"
      >
        <span id="weatherCurrentLabel">Current</span>
      </button>
      <button
        type="button"
        data-on-click="setWeatherType" data-args='["race_day"]'
        id="weatherRaceDayBtn"
        class="weather-type-btn flex-1 px-2 py-0.5 text-[9px] font-bold uppercase text-center border border-black transition-all bg-racing-red text-white"
        data-weather-tooltip-trigger
      >
        <span id="weatherRaceDayText">Race day</span>
      </button>
    </div>
    <input type="radio" name="weatherType" value="current" class="hidden" />
    <input
      type="radio"
      name="weatherType"
      value="race_day"
      checked
      class="hidden"
      id="weatherRaceDayRadio"
    />
  </div>

  <div class="flex-shrink-0 px-2 py-1.5 border-t-2 border-black bg-gray-50" id="displayContainer">
    <label class="text-xs font-bold uppercase mb-1.5 block" id="displayLabel"
      >Display</label
    >
    <div class="grid grid-cols-4 gap-1" id="displayTypeContainer">
      <button
        type="button"
        data-on-click="setDisplayType" data-args='["1bit"]'
        id="display1bitBtn"
        class="display-type-btn min-w-0 px-1 py-1 text-[9px] font-bold uppercase text-center border border-black transition-all bg-black text-white"
      >
        B/W
      </button>
      <button
        type="button"
        data-on-click="setDisplayType" data-args='["bwr"]'
        id="displayBwrBtn"
        class="display-type-btn min-w-0 px-1 py-1 text-[9px] font-bold uppercase text-center border border-black transition-all bg-white hover:bg-racing-red hover:text-white"
      >
        B/W/R
      </button>
      <button
        type="button"
        data-on-click="setDisplayType" data-args='["bwry"]'
        id="displayBwryBtn"
        class="display-type-btn min-w-0 px-1 py-1 text-[9px] font-bold uppercase text-center border border-black transition-all bg-white hover:bg-racing-red hover:text-white"
      >
        B/W/R/Y
      </button>
      <button
        type="button"
        data-on-click="setDisplayType" data-args='["spectra6"]'
        id="displaySpectra6Btn"
        class="display-type-btn min-w-0 px-1 py-1 text-[9px] font-bold uppercase text-center border border-black transition-all bg-white hover:bg-black hover:text-white"
      >
        6C
      </button>
    </div>
  </div>
{% endcall %}

<!-- Weather - Mobile -->
<div class="lg:hidden p-3 border-b-2 border-black bg-gray-50" id="mobileWeatherContainer">
  <div class="mb-2 flex items-center gap-1">
    <label class="block text-xs font-bold uppercase" id="weatherLabelMobile"
      >Weather</label
    >
  </div>
  <div class="grid grid-cols-3 gap-1">
    <button
      type="button"
      data-on-click="setWeatherType" data-args='["off"]'
      id="weatherOffBtnMobile"
      class="weather-type-btn-mobile min-w-0 px-2 py-2 text-[11px] font-bold uppercase text-center border-2 border-black transition-all bg-white hover:bg-black hover:text-white"
    >
      OFF
    </button>
    <button
      type="button"
      data-on-click="setWeatherType" data-args='["current"]'
      id="weatherCurrentBtnMobile"
      class="weather-type-btn-mobile min-w-0 px-2 py-2 text-[11px] font-bold uppercase text-center border-2 border-black transition-all bg-white hover:bg-black hover:text-white"
    >
      Current
    </button>
    <button
      type="button"
      data-on-click="setWeatherType" data-args='["race_day"]'
      id="weatherRaceDayBtnMobile"
      class="weather-type-btn-mobile min-w-0 px-2 py-2 text-[11px] font-bold uppercase text-center border-2 border-black transition-all bg-racing-red text-white"
      data-weather-tooltip-trigger
    >
      Race Day
    </button>
  </div>
</div>

<!-- Display Type - Mobile -->
<div class="lg:hidden p-3 border-b-2 border-black bg-gray-50" id="mobileDisplayContainer">
  <label class="block text-xs font-bold uppercase mb-2" id="displayLabelMobile"
    >Display</label
  >
  <div class="grid grid-cols-4 gap-1">
    <button
      type="button"
      data-on-click="setDisplayType" data-args='["1bit"]'
      id="display1bitBtnMobile"
      class="display-type-btn-mobile min-w-0 px-1 py-2 text-[11px] font-bold uppercase text-center border-2 border-black transition-all bg-black text-white"
    >
      B/W
    </button>
    <button
      type="button"
      data-on-click="setDisplayType" data-args='["bwr"]'
      id="displayBwrBtnMobile"
      class="display-type-btn-mobile min-w-0 px-1 py-2 text-[11px] font-bold uppercase text-center border-2 border-black transition-all bg-white hover:bg-racing-red hover:text-white"
    >
      B/W/R
    </button>
    <button
      type="button"
      data-on-click="setDisplayType" data-args='["bwry"]'
      id="displayBwryBtnMobile"
      class="display-type-btn-mobile min-w-0 px-1 py-2 text-[11px] font-bold uppercase text-center border-2 border-black transition-all bg-white hover:bg-racing-red hover:text-white"
    >
      B/W/R/Y
    </button>
    <button
      type="button"
      data-on-click="setDisplayType" data-args='["spectra6"]'
      id="displaySpectra6BtnMobile"
      class="display-type-btn-mobile min-w-0 px-1 py-2 text-[11px] font-bold uppercase text-center border-2 border-black transition-all bg-white hover:bg-black hover:text-white"
    >
      6C
    </button>
  </div>
</div>

<!-- Mobile Race Selector (Calendar only) -->
<div class="lg:hidden p-3 border-t-2 border-black bg-gray-50" id="mobileRaceContainer">
  <label class="block text-xs font-bold uppercase mb-2" id="raceLabel" for="raceSelectMobile"
    >Race</label
  >
  <select
    id="raceSelectMobile"
    data-on-change="selectRaceMobile"
    class="w-full appearance-none bg-white border-2 border-black px-3 py-2 text-sm focus:outline-none shadow-neo-sm"
  >
    <option value="">{{ t.get('next_race', 'Next Race') }}</option>
  </select>
</div>
