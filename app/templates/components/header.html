<!-- Header -->
<header
  class="bg-white border-b-4 border-black flex-shrink-0 z-30 relative w-full"
>
  <div class="max-w-full mx-auto px-2 md:px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2 md:gap-4">
      <button
        id="mobileMenuBtn"
        onclick="toggleMobileMenu()"
        aria-label="{{ nav.get('nav_menu', 'Menu') }}"
        class="lg:hidden p-2 border-2 border-black shadow-neo active:shadow-none active:translate-x-[2px] active:translate-y-[2px] transition-all bg-white text-black"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="square"
            stroke-linejoin="miter"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>
      <a
        href="{{ lang_url('/') }}"
        class="flex items-center gap-2 hover:opacity-80 transition-opacity"
      >
        <picture>
          <source
            srcset="/static/images/f1_homepage_logo_1x.webp"
            type="image/webp"
          />
          <img
            src="/static/images/f1_homepage_logo_optimized.png"
            alt="F1 InkyCloud"
            class="h-11 md:h-10 w-auto object-contain"
            width="340"
            height="40"
            fetchpriority="high"
          />
        </picture>
      </a>
    </div>

    <div
      class="ml-auto flex items-center gap-2 md:gap-4 text-xs font-bold uppercase tracking-wider"
    >
      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-4 mr-4">
        {% if active_page != 'home' %}
        <a
          href="{{ lang_url('/') }}"
          class="hover:text-racing-red transition-colors"
          >{{ nav.nav_home }}</a
        >
        {% endif %}
        <a
          href="{{ lang_url('/stats') }}"
          class="{% if active_page == 'stats' %}text-racing-red{% else %}hover:text-racing-red{% endif %} transition-colors"
          >{{ nav.nav_stats }}</a
        >
        <a
          href="{{ lang_url('/api/docs/html') }}"
          class="{% if active_page == 'api' %}text-racing-red{% else %}hover:text-racing-red{% endif %} transition-colors"
          >{{ nav.nav_api }}</a
        >
        <a
          href="{{ lang_url('/privacy') }}"
          class="{% if active_page == 'privacy' %}text-racing-red{% else %}hover:text-racing-red{% endif %} transition-colors"
          >{{ nav.nav_privacy }}</a
        >
        <a
          href="{{ lang_url('/changelog') }}"
          class="{% if active_page == 'changelog' %}text-racing-red{% else %}hover:text-racing-red{% endif %} transition-colors"
          >{{ nav.nav_changelog }}</a
        >
        <a
          href="https://github.com/Rhiz3K/InkyCloud-F1"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-racing-red transition-colors"
          >GitHub</a
        >
      </nav>

      <!-- Language Switcher -->
      <div class="relative group flex justify-end md:block">
        <label
          for="uiLangSwitch"
          class="sr-only"
        >
          {{ nav.get('nav_language', 'Language') }}</label
        >
        <select
          id="uiLangSwitch"
          onchange="switchUiLanguage()"
          aria-label="{{ nav.get('nav_language', 'Language') }}"
          class="appearance-none bg-white border-2 border-black px-3 py-1 cursor-pointer hover:bg-racing-red hover:text-white transition-colors focus:outline-none shadow-neo-sm"
        >
          {% for language in supported_languages %}
          <option value="{{ language.code }}" {{ language.selected }}>{{ language.label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
</header>
