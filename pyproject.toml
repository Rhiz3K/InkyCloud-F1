[project]
name = "f1-eink-cal"
version = "1.2.33"
description = "F1 E-Ink calendar service generating 800x480 1-bit BMPs for LaskaKit displays"
readme = "README.md"
authors = [
    { name = "Rhiz3K" },
]
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.104.0",
    # >=0.30 for CIDR support in --forwarded-allow-ips (the .env ships 10.0.0.0/8-style ranges,
    # which older uvicorn treats as literal strings that never match the proxy IP).
    "uvicorn[standard]>=0.30.0",
    "pillow>=12.2.0",
    "httpx>=0.25.0",
    "sentry-sdk[fastapi]>=1.38.0",
    "python-dotenv>=1.2.2",
    "apscheduler>=3.10.0",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.0.0",
    "cachetools>=6.2.4",
    "pydantic-settings>=2.14.2",
    "jinja2>=3.1.0",
    "boto3>=1.35.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.5.0",
    "interrogate>=1.7.0",
    "mypy>=1.19.1",
    "numpy>=2.4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-codspeed>=4.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.10",
    "scikit-learn>=1.8.0",
    "types-aiofiles>=25.1.0.20251011",
    "types-cachetools>=6.2.0.20251022",
    "types-markdown>=3.10.0.20251106",
]

[project.urls]
Homepage = "https://github.com/Rhiz3K/InkyCloud-F1"
Repository = "https://github.com/Rhiz3K/InkyCloud-F1"
Issues = "https://github.com/Rhiz3K/InkyCloud-F1/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
"app" = [
    "assets/**/*",
    "templates/*.html",
    "templates/**/*.html",
]

[tool.setuptools.data-files]
"share/f1-eink-cal" = ["CHANGELOG.md"]
"share/f1-eink-cal/translations" = ["translations/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Ignore line length in main.py due to inline HTML templates
"app/main.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
explicit_package_bases = true

[tool.interrogate]
fail-under = 100
verbose = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: performance benchmarks run only in CodSpeed workflow",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "interrogate>=1.7.0",
    "mypy>=1.19.1",
    "numpy>=2.4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-codspeed>=4.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.10",
    "scikit-learn>=1.8.0",
    "types-aiofiles>=25.1.0.20251011",
    "types-cachetools>=6.2.0.20251022",
    "types-markdown>=3.10.0.20251106",
]
