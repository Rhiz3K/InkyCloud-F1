version = 1

exclude_patterns = [
  ".venv/**",
  "__pycache__/**",
  "*.egg-info/**",
  "app/assets/**",
  "conductor/**",
  "openspec/changes/archive/**"
]

test_patterns = [
  "tests/**",
  "test_*.py",
  "*_test.py"
]

[[analyzers]]
name = "python"
enabled = true
dependency_file_paths = ["pyproject.toml"]

[analyzers.meta]
runtime_version = "3.x.x"
max_line_length = 100
skip_doc_coverage = ["module", "magic", "init"]
type_checker = "mypy"
cyclomatic_complexity_threshold = "high"

[[analyzers.ignore_rules]]
rule_ids = ["PYL-W1203", "PYL-R0201"]

[[analyzers]]
name = "docker"
enabled = true

[analyzers.meta]
dockerfile_paths = ["Dockerfile"]
trusted_registries = ["docker.io", "ghcr.io"]

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "test-coverage"
enabled = false

[[code_formatters]]
name = "ruff"
enabled = true
