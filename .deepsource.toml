version = 1

exclude_patterns = [
  ".venv/**",
  "__pycache__/**",
  "*.egg-info/**",
  "app/assets/**",
  ".auto-claude/**"
]

test_patterns = [
  "tests/**",
  "test_*.py",
  "*_test.py"
]

[[analyzers]]
name = "python"
enabled = true
dependency_file_paths = ["pyproject.toml"]

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 100
  skip_doc_coverage = ["module", "magic", "init"]
  type_checker = "mypy"
  cyclomatic_complexity_threshold = "high"



[[analyzers]]
name = "docker"
enabled = true

[analyzers.meta]
dockerfile_paths = ["Dockerfile"]
trusted_registries = ["docker.io", "ghcr.io"]

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "test-coverage"
enabled = false

[[code_formatters]]
name = "ruff"
enabled = true
