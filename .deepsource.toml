version = 1

exclude_patterns = [
  ".venv/**",
  "__pycache__/**",
  "*.egg-info/**",
  "app/assets/**",
  "conductor/**",
  "openspec/changes/archive/**"
]

test_patterns = [
  "tests/**",
  "test_*.py",
  "*_test.py"
]

# Python Analyzer - static code analysis with mypy type checking
[[analyzers]]
name = "python"
enabled = true
dependency_file_paths = ["pyproject.toml"]

  [analyzers.meta]
  runtime_version = "3.12.x"
  max_line_length = 100
  skip_doc_coverage = ["module", "magic", "init"]
  type_checker = "mypy"
  cyclomatic_complexity_threshold = "high"

# Docker Analyzer - Dockerfile best practices
[[analyzers]]
name = "docker"
enabled = true

  [analyzers.meta]
  dockerfile_paths = ["Dockerfile"]
  trusted_registries = ["docker.io", "ghcr.io"]

# Secrets Analyzer - detect hardcoded credentials
[[analyzers]]
name = "secrets"
enabled = true

# Test Coverage Analyzer
[[analyzers]]
name = "test-coverage"
enabled = true

# Ruff Code Formatter - auto-fix formatting in PRs
[[code_formatters]]
name = "ruff"
enabled = true
